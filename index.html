<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PenguHoods — Mint</title>
<meta property="og:title" content="PenguHoods (PHOOD) — Mint">
<meta property="og:description" content="2,026 generative voxel penguins on Robinhood Chain. Mint opens Tue 25 Nov 2026 (WIB).">
<meta property="og:image" content="logo.jpg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b1526; color: #eef4fb; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; text-align: center; }
  img.logo { width: 180px; height: 180px; object-fit: cover; border-radius: 24px; border: 3px solid #2b4a73; }
  h1 { font-size: 34px; margin: 16px 0 4px; letter-spacing: .5px; }
  .sub { color: #9db8d6; font-size: 15px; }
  .card { background: #12233d; border: 1px solid #24405f; border-radius: 18px; padding: 18px; margin-top: 20px; }
  .phase { font-size: 20px; font-weight: 700; }
  .price { color: #ffd75e; font-weight: 700; margin-top: 4px; }
  .supply { color: #9db8d6; margin-top: 6px; font-size: 14px; }
  .sched { text-align: left; font-size: 14px; line-height: 1.9; color: #c9daf0; margin-top: 6px; }
  .sched b { color: #fff; }
  .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button { background: #ffd75e; color: #14213a; border: 0; border-radius: 12px; padding: 13px 22px; font-size: 16px; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .qty { display: flex; align-items: center; gap: 12px; }
  .qty button { padding: 8px 16px; font-size: 20px; }
  .qty span { font-size: 20px; font-weight: 800; min-width: 28px; }
  #status { margin-top: 14px; font-size: 14px; color: #9db8d6; min-height: 20px; word-break: break-word; }
  #status a { color: #ffd75e; }
  .foot { margin-top: 22px; font-size: 13px; color: #7e97b5; }
  .foot a { color: #9db8d6; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.jpg" alt="PenguHoods">
  <h1>PenguHoods</h1>
  <div class="sub">2,026 generative voxel penguins · Robinhood Chain</div>

  <div class="card">
    <div class="phase" id="phase">Loading…</div>
    <div class="price" id="price"></div>
    <div class="supply" id="supply"></div>
    <div class="sched">
      🗓 <b>Tuesday 25 Nov 2026 (WIB)</b><br>
      Team 19:30 · GTD 20:00 (max 2/wallet, free) · FCFS 21:30 (max 1/wallet, free) · Public 23:00
    </div>
    <div class="row">
      <button id="connect">Connect Wallet</button>
    </div>
    <div class="row qty">
      <button id="minus">−</button><span id="qty">1</span><button id="plus">+</button>
      <button id="mint" disabled>Mint</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="foot">
    Contract: <a href="https://robinhoodchain.blockscout.com/address/0x9c62f1beE43D9Fe9811D40eB332E82ce753d0f33" target="_blank" rel="noopener">0x0EB1…68b3</a> ·
    <a href="https://x.com/penguhoods" target="_blank" rel="noopener">@penguhoods</a><br>
    Reveal after the mint ends. Royalties 10%.
  </div>
</div>

<script>
const CONTRACT = "0x9c62f1beE43D9Fe9811D40eB332E82ce753d0f33";
const RPC = "https://rpc.mainnet.chain.robinhood.com";
const CHAIN_ID = "0x1237"; // 4663 Robinhood Chain
const SEL = { phase: "0xb1c9fe6e", totalMinted: "0xa2309ff8", maxSupply: "0xd5abeb01", mintPrice: "0x6817c76c", mint: "0xa0712d68" };
const PHASES = ["Closed", "GTD", "FCFS", "Public"];
const CAPS = [0, 2, 1, 10];
let account = null, phase = 0, mintPriceWei = 0n, qty = 1;

const $ = id => document.getElementById(id);
const status = (html) => { $("status").innerHTML = html; };

async function rpcCall(data) {
  const r = await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to: CONTRACT, data }, "latest"] }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return BigInt(j.result);
}

async function refresh() {
  try {
    const [p, minted, max, price] = await Promise.all([rpcCall(SEL.phase), rpcCall(SEL.totalMinted), rpcCall(SEL.maxSupply), rpcCall(SEL.mintPrice)]);
    phase = Number(p); mintPriceWei = price;
    $("phase").textContent = phase === 0 ? "⏳ Mint not open yet" : "🟢 Phase: " + PHASES[phase];
    $("price").textContent = phase === 3 ? "Price: " + (Number(price) / 1e18).toFixed(6) + " ETH" : (phase > 0 ? "Price: FREE" : "");
    $("supply").textContent = "Minted: " + minted.toString() + " / " + max.toString();
    if (qty > (CAPS[phase] || 10)) { qty = CAPS[phase] || 1; $("qty").textContent = qty; }
    $("mint").disabled = !(account && phase > 0);
  } catch (e) { $("phase").textContent = "Could not load contract state"; }
}

async function ensureChain() {
  try { await ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_ID }] }); }
  catch (e) {
    if (e.code === 4902) {
      await ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: CHAIN_ID, chainName: "Robinhood Chain",
        nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: [RPC], blockExplorerUrls: ["https://robinhoodchain.blockscout.com"] }] });
    } else throw e;
  }
}

$("connect").onclick = async () => {
  if (!window.ethereum) { status("No wallet found. Open this page inside your wallet browser (Bitget / MetaMask)."); return; }
  try {
    await ensureChain();
    const accs = await ethereum.request({ method: "eth_requestAccounts" });
    account = accs[0];
    $("connect").textContent = account.slice(0, 6) + "…" + account.slice(-4);
    status("Wallet connected.");
    refresh();
  } catch (e) { status("Connect failed: " + (e.message || e)); }
};

$("minus").onclick = () => { if (qty > 1) { qty--; $("qty").textContent = qty; } };
$("plus").onclick = () => { const cap = CAPS[phase] || 10; if (qty < cap) { qty++; $("qty").textContent = qty; } };

$("mint").onclick = async () => {
  if (!account || phase === 0) return;
  try {
    await ensureChain();
    const value = phase === 3 ? mintPriceWei * BigInt(qty) : 0n;
    const data = SEL.mint + qty.toString(16).padStart(64, "0");
    status("Confirm the transaction in your wallet…");
    const tx = await ethereum.request({ method: "eth_sendTransaction",
      params: [{ from: account, to: CONTRACT, data, value: "0x" + value.toString(16) }] });
    status('Sent! Tx: <a href="https://robinhoodchain.blockscout.com/tx/' + tx + '" target="_blank" rel="noopener">' + tx.slice(0, 18) + '…</a>');
    setTimeout(refresh, 4000);
  } catch (e) { status("Mint failed: " + (e.message || e)); }
};

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
